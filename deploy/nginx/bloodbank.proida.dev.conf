# Install in Nginx's included conf.d directory in the Proxmox LXC (192.168.1.82).
# Prerequisites:
# - The Docker VM publishes the app at 192.168.1.135:3001.
# - The Nginx LXC can reach that address over the private network.
# - A certificate covering bloodbank.proida.dev and its key exist at the
#   paths below INSIDE the Nginx container. Adjust these paths as needed.
server {
    listen 80;
    server_name bloodbank.proida.dev;

    return 301 https://bloodbank.proida.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name bloodbank.proida.dev;

    ssl_certificate /etc/letsencrypt/live/bloodbank.proida.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloodbank.proida.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # The production app serves both the frontend and /api on port 3001.
        # Keep this address aligned with APP_BIND_IP and APP_PORT.
        proxy_pass http://192.168.1.135:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
