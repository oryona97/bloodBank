# Install in the existing Nginx container's included conf.d directory.
# Prerequisites:
# - Nginx and the app share a user-defined Docker network.
# - The app has the network alias "bloodbank" on that network.
# - A certificate covering bloodbank.proida.dev and its key exist at the
#   paths below INSIDE the Nginx container. Adjust these paths as needed.
server {
    listen 80;
    server_name bloodbank.proida.dev;

    return 301 https://bloodbank.proida.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name bloodbank.proida.dev;

    ssl_certificate /etc/letsencrypt/live/bloodbank.proida.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloodbank.proida.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker DNS refreshes the upstream after app container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # The production app serves both the frontend and /api on port 3001.
        set $bloodbank_upstream bloodbank:3001;
        proxy_pass http://$bloodbank_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
