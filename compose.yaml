services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: bloodbank
      PGUSER: bloodbank
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - '127.0.0.1:${APP_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloodbank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: bloodbank
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bloodbank_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bloodbank -d bloodbank']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  bloodbank_data:
